name: Update MARCAP via KRX Open API

on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * 1-5"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pandas pyarrow
      - name: Resolve KRX date
        id: date
        run: |
          echo "bas_dd=$(TZ=Asia/Seoul date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "year=$(TZ=Asia/Seoul date +%Y)" >> "$GITHUB_OUTPUT"
      - name: Fetch and write MARCAP
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: |
          test -n "$KRX_AUTH_KEY"
          python krx_marcap_openapi_adapter_v1.py \
            --date "${{ steps.date.outputs.bas_dd }}" \
            --output "data/marcap-${{ steps.date.outputs.year }}.parquet"
      - name: Commit API-only artifact
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/
          git diff --cached --quiet || git commit -m "Update MARCAP via KRX Open API"
          git push
